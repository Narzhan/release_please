[project]
name = "calculator"
version = "0.3.0"
description = "it is a fucking calculator"
authors = [
    {name = "Narzhan",email = "vasek.bruzek@gmail.com"}
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "pytest (>=9.0.3,<10.0.0)"
]

[project.optional-dependencies]
test = [
    "pytest (>=9.0.2,<10.0.0)",
]
dev = [
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
requires-poetry = ">=2.1"
packages = [
    { include = "calculator", from = "src" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = "src"


[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 120
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
extend-select = ["I"]
